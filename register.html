<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitGenius - Crear Cuenta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            display: flex;
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.1);
        }

        .auth-card {
            flex: 1;
            padding: 40px;
            max-width: 500px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .logo i {
            margin-right: 10px;
            font-size: 28px;
        }

        .auth-header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .auth-header p {
            color: #666;
            font-size: 16px;
        }

        .auth-form {
            margin-top: 20px;
        }

        .form-group {
            position: relative;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 43px;
            color: #667eea;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 43px;
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
        }

        .checkbox-group {
            margin: 20px 0;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            position: relative;
            padding-left: 35px;
            cursor: pointer;
            font-size: 14px;
            color: #666;
        }

        .checkbox-container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .checkmark {
            position: absolute;
            left: 0;
            top: 0;
            height: 20px;
            width: 20px;
            background-color: #fff;
            border: 2px solid #e1e5e9;
            border-radius: 5px;
        }

        .checkbox-container input:checked ~ .checkmark {
            background-color: #667eea;
            border-color: #667eea;
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }

        .checkbox-container input:checked ~ .checkmark:after {
            display: block;
        }

        .checkbox-container .checkmark:after {
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .checkbox-container a {
            color: #667eea;
            text-decoration: none;
        }

        .checkbox-container a:hover {
            text-decoration: underline;
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-full {
            width: 100%;
            margin-bottom: 20px;
        }

        .auth-divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .auth-divider span {
            background: white;
            padding: 0 15px;
            color: #666;
            font-size: 14px;
            position: relative;
            z-index: 1;
        }

        .auth-divider:before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e1e5e9;
        }

        .social-auth {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-social {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #fff;
            border: 2px solid #e1e5e9;
            color: #333;
        }

        .btn-social:hover {
            background: #f8f9fa;
        }

        .btn-google:hover {
            border-color: #DB4437;
            color: #DB4437;
        }

        .btn-facebook:hover {
            border-color: #4267B2;
            color: #4267B2;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
        }

        .auth-footer p {
            color: #666;
        }

        .auth-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .auth-image {
            flex: 1;
            position: relative;
            display: flex;
            overflow: hidden;
        }

        .auth-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            color: white;
            padding: 40px;
        }

        .image-overlay h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        @media (max-width: 900px) {
            .auth-image {
                display: none;
            }
            
            .auth-container {
                justify-content: center;
            }
            
            .auth-card {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <i class="fas fa-dumbbell"></i>
                    <span>FitGenius</span>
                </div>
                <h1>Crear Cuenta</h1>
                <p>Comienza tu viaje fitness con nosotros</p>
            </div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="first_name">Nombre</label>
                    <input type="text" id="first_name" name="first_name" required>
                    <i class="fas fa-user input-icon"></i>
                </div>

                <div class="form-group">
                    <label for="last_name">Apellido</label>
                    <input type="text" id="last_name" name="last_name" required>
                    <i class="fas fa-user input-icon"></i>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required>
                    <i class="fas fa-envelope input-icon"></i>
                </div>

                <div class="form-group">
                    <label for="date_of_birth">Fecha de nacimiento</label>
                    <input type="date" id="date_of_birth" name="date_of_birth" required>
                    <i class="fas fa-calendar input-icon"></i>
                </div>

                <div class="form-group">
                    <label for="gender">Género</label>
                    <select id="gender" name="gender" required style="width: 100%; padding: 15px 15px 15px 45px; border: 2px solid #e1e5e9; border-radius: 10px; font-size: 16px; appearance: none;">
                        <option value="">Seleccionar</option>
                        <option value="hombre">Hombre</option>
                        <option value="mujer">Mujer</option>
                        <option value="otro">Otro</option>
                    </select>
                    <i class="fas fa-venus-mars input-icon"></i>
                </div>

                <div class="form-group">
                    <label for="height">Estatura (cm)</label>
                    <input type="number" id="height" name="height" step="0.1" required>
                    <i class="fas fa-ruler-vertical input-icon"></i>
                </div>

                <div class="form-group">
                    <label for="weight">Peso (kg)</label>
                    <input type="number" id="weight" name="weight" step="0.1" required>
                    <i class="fas fa-weight input-icon"></i>
                </div>

                <div class="form-group">
                    <label for="fitness_level">Nivel de fitness</label>
                    <select id="fitness_level" name="fitness_level" required style="width: 100%; padding: 15px 15px 15px 45px; border: 2px solid #e1e5e9; border-radius: 10px; font-size: 16px; appearance: none;">
                        <option value="">Seleccionar</option>
                        <option value="principiante">Principiante</option>
                        <option value="intermedio">Intermedio</option>
                        <option value="avanzado">Avanzado</option>
                    </select>
                    <i class="fas fa-running input-icon"></i>
                </div>

                <div class="form-group">
                    <label>Objetivos (selecciona al menos uno)</label>
                    <div style="margin-top: 10px;">
                        <label style="display: block; margin-bottom: 8px;">
                            <input type="checkbox" name="goals" value="weight_loss"> Pérdida de peso
                        </label>
                        <label style="display: block; margin-bottom: 8px;">
                            <input type="checkbox" name="goals" value="muscle_gain"> Ganancia muscular
                        </label>
                        <label style="display: block; margin-bottom: 8px;">
                            <input type="checkbox" name="goals" value="endurance"> Resistencia
                        </label>
                        <label style="display: block; margin-bottom: 8px;">
                            <input type="checkbox" name="goals" value="flexibility"> Flexibilidad
                        </label>
                        <label style="display: block;">
                            <input type="checkbox" name="goals" value="strength"> Fuerza
                        </label>
                    </div>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-container">
                        Acepto los <a href="#">términos y condiciones</a> y la <a href="#">política de privacidad</a>
                        <input type="checkbox" name="terms" required>
                        <span class="checkmark"></span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Crear Cuenta</button>

                <div class="auth-divider">
                    <span>o registrarse con</span>
                </div>

                <div class="social-auth">
                    <button type="button" class="btn btn-social btn-google">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button type="button" class="btn btn-social btn-facebook">
                        <i class="fab fa-facebook-f"></i> Facebook
                    </button>
                </div>

                <div class="auth-footer">
                    <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
                </div>
            </form>
        </div>

        <div class="auth-image">
            <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48" alt="Entrenamiento FitGenius">
            <div class="image-overlay">
                <h2>Comienza tu transformación</h2>
                <p>Únete a miles de usuarios que ya están alcanzando sus objetivos</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const registerForm = document.getElementById('registerForm');
            
            // Enviar formulario de registro
            registerForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // Obtener los objetivos seleccionados
                const selectedGoals = [];
                document.querySelectorAll('input[name="goals"]:checked').forEach(checkbox => {
                    selectedGoals.push(checkbox.value);
                });
                
                if (selectedGoals.length === 0) {
                    alert('Por favor selecciona al menos un objetivo');
                    return;
                }
                
                const formData = {
                    body: {
                        email: document.getElementById('email').value,
                        first_name: document.getElementById('first_name').value,
                        last_name: document.getElementById('last_name').value,
                        date_of_birth: document.getElementById('date_of_birth').value,
                        gender: document.getElementById('gender').value,
                        height: parseFloat(document.getElementById('height').value),
                        weight: parseFloat(document.getElementById('weight').value),
                        fitness_level: document.getElementById('fitness_level').value,
                        goals: selectedGoals
                    }
                };
                
                try {
                    const response = await fetch('https://felipe021104.app.n8n.cloud/webhook/fitgenius-register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(formData)
                    });
                    
                    const result = await response.json();
                    
                    if (response.ok) {
                        alert('¡Cuenta creada exitosamente!');
                        // Redirigir al dashboard o página principal
                        window.location.href = 'home.html';
                    } else {
                        alert('Error: ' + (result.error || 'No se pudo crear la cuenta'));
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error de conexión. Intenta nuevamente.');
                }
            });
        });
    </script>
</body>
</html>
