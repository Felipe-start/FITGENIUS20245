<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitGenius - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Tus estilos existentes se mantienen igual */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header i {
            font-size: 50px;
            color: #667eea;
            margin-bottom: 15px;
        }

        .auth-header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 5px;
        }

        .auth-header p {
            color: #666;
            font-size: 14px;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .auth-tab {
            flex: 1;
            background: none;
            border: none;
            padding: 10px;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 10px;
        }

        .auth-tab.active {
            background: #667eea;
            color: white;
        }

        .auth-form {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .auth-form.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-google {
            background: white;
            color: #333;
            border: 2px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-google:hover {
            background: #f5f5f5;
        }

        .btn-google img {
            width: 20px;
            height: 20px;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 45%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 0;
            width: 45%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 10px;
            color: #666;
            font-size: 14px;
        }

        .loader {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loader.active {
            display: flex;
        }

        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            animation: slideIn 0.3s ease-out;
            z-index: 1001;
        }

        .notification.success {
            background: #48bb78;
        }

        .notification.error {
            background: #f56565;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <div class="loader-spinner"></div>
    </div>

    <div class="auth-container">
        <div class="auth-header">
            <i class="fas fa-dumbbell"></i>
            <h1>FitGenius</h1>
            <p>Tu asistente personal de fitness</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchTab('login')">Iniciar Sesión</button>
            <button class="auth-tab" onclick="switchTab('register')">Registrarse</button>
        </div>

        <!-- Login Form -->
        <div class="auth-form active" id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            <button class="btn btn-primary" onclick="handleLogin()">Iniciar Sesión</button>
            
            <div class="divider">
                <span>o</span>
            </div>
            
            <button class="btn btn-google" onclick="handleGoogleLogin()">
                <img src="https://www.google.com/favicon.ico" alt="Google">
                Continuar con Google
            </button>
        </div>

        <!-- Register Form -->
        <div class="auth-form" id="registerForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="registerFirstName" placeholder="Juan">
                </div>
                <div class="form-group">
                    <label>Apellido</label>
                    <input type="text" id="registerLastName" placeholder="Pérez">
                </div>
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="registerEmail" placeholder="juan@email.com">
            </div>
            
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="registerPassword" placeholder="Mínimo 6 caracteres">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Fecha de Nacimiento</label>
                    <input type="date" id="registerBirthDate">
                </div>
                <div class="form-group">
                    <label>Género</label>
                    <select id="registerGender">
                        <option value="">Seleccionar</option>
                        <option value="male">Masculino</option>
                        <option value="female">Femenino</option>
                        <option value="other">Otro</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Altura (cm)</label>
                    <input type="number" id="registerHeight" placeholder="170">
                </div>
                <div class="form-group">
                    <label>Peso (kg)</label>
                    <input type="number" id="registerWeight" placeholder="70">
                </div>
            </div>
            
            <div class="form-group">
                <label>Nivel de Fitness</label>
                <select id="registerFitnessLevel">
                    <option value="beginner">Principiante</option>
                    <option value="intermediate">Intermedio</option>
                    <option value="advanced">Avanzado</option>
                </select>
            </div>
            
            <button class="btn btn-primary" onclick="handleRegister()">Crear Cuenta</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuración de Supabase
        const SUPABASE_URL = 'https://mbrlhpqbjypdrgsjqycs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1icmxocHFianlwZHJnc2pxeWNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1NDU1MDYsImV4cCI6MjA4OTEyMTUwNn0.C5plEF0kwXqkGBqq_iSO0XLFdMPkrI9DEXbXCAQ8YCA';

        // Inicializar Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Funciones de utilidad
        function showLoader() {
            document.getElementById('loader').classList.add('active');
        }

        function hideLoader() {
            document.getElementById('loader').classList.remove('active');
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        function switchTab(tab) {
            const tabs = document.querySelectorAll('.auth-tab');
            const forms = document.querySelectorAll('.auth-form');
            
            tabs.forEach(t => t.classList.remove('active'));
            forms.forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        // Función de Login con Supabase
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showNotification('Por favor completa todos los campos', 'error');
                return;
            }

            showLoader();

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                showNotification('¡Inicio de sesión exitoso!');
                
                // Guardar información del usuario si es necesario
                if (data.user) {
                    localStorage.setItem('fitgenius_user', JSON.stringify({
                        id: data.user.id,
                        email: data.user.email
                    }));
                }
                
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 1000);
            } catch (error) {
                console.error('Error en login:', error);
                showNotification(error.message || 'Error al iniciar sesión', 'error');
            } finally {
                hideLoader();
            }
        }

        // Función de Registro con Supabase
        async function handleRegister() {
            const firstName = document.getElementById('registerFirstName').value;
            const lastName = document.getElementById('registerLastName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const birthDate = document.getElementById('registerBirthDate').value;
            const gender = document.getElementById('registerGender').value;
            const height = document.getElementById('registerHeight').value;
            const weight = document.getElementById('registerWeight').value;
            const fitnessLevel = document.getElementById('registerFitnessLevel').value;

            if (!firstName || !lastName || !email || !password) {
                showNotification('Por favor completa todos los campos requeridos', 'error');
                return;
            }

            if (password.length < 6) {
                showNotification('La contraseña debe tener al menos 6 caracteres', 'error');
                return;
            }

            showLoader();

            try {
                // Registrar usuario en Supabase Auth
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            first_name: firstName,
                            last_name: lastName,
                            full_name: `${firstName} ${lastName}`
                        }
                    }
                });

                if (authError) throw authError;

                // Si se creó el usuario, crear su perfil en la tabla profiles
                if (authData.user) {
                    const { error: profileError } = await supabase
                        .from('profiles')
                        .insert([
                            {
                                id: authData.user.id,
                                email: email,
                                first_name: firstName,
                                last_name: lastName,
                                date_of_birth: birthDate || null,
                                gender: gender || null,
                                height: height ? parseFloat(height) : null,
                                weight: weight ? parseFloat(weight) : null,
                                fitness_level: fitnessLevel || 'beginner',
                                goals: []
                            }
                        ]);

                    if (profileError) {
                        console.error('Error creando perfil:', profileError);
                        // No lanzamos error porque el usuario ya se creó
                    }
                }

                showNotification('¡Registro exitoso! Por favor verifica tu email.');
                
                // Limpiar formulario y cambiar a login
                setTimeout(() => {
                    switchTab('login');
                    document.getElementById('loginEmail').value = email;
                }, 2000);
            } catch (error) {
                console.error('Error en registro:', error);
                showNotification(error.message || 'Error al registrar usuario', 'error');
            } finally {
                hideLoader();
            }
        }

        // Función de Login con Google
        async function handleGoogleLogin() {
            showLoader();

            try {
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/home.html'
                    }
                });

                if (error) throw error;
            } catch (error) {
                console.error('Error en Google login:', error);
                showNotification(error.message || 'Error al conectar con Google', 'error');
                hideLoader();
            }
        }

        // Verificar si ya hay sesión activa
        async function checkSession() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    // Si hay sesión, redirigir al home
                    window.location.href = 'home.html';
                }
            } catch (error) {
                console.error('Error verificando sesión:', error);
            }
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            checkSession();
        });
    </script>
</body>
</html>
